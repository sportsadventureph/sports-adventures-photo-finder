<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Adventures PH | Find My Photos</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        header p {
            color: #ccc;
        }

        .hero {
            text-align: center;
            padding: 70px 20px;
            background: white;
        }

        .hero h2 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
        }

        .search-box {
            max-width: 550px;
            margin: auto;
            display: flex;
            gap: 10px;
        }

        .search-box input {
            flex: 1;
            padding: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .search-box button {
            padding: 16px 25px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .search-box button:hover {
            background: #333;
        }

        .events {
            max-width: 1100px;
            margin: auto;
            padding: 50px 20px;
        }

        .events h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .event-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .event-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .event-image {
            height: 180px;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
        }

        .event-info {
            padding: 20px;
        }

        .event-info h3 {
            margin-bottom: 8px;
        }

        .event-info p {
            color: #777;
            margin-bottom: 15px;
        }

        .event-info button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #111;
            color: white;
            cursor: pointer;
        }

        footer {
            background: #111;
            color: #aaa;
            text-align: center;
            padding: 25px;
            margin-top: 30px;
        }

        @media (max-width: 600px) {
            .hero h2 {
                font-size: 32px;
            }

            .search-box {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>SPORTS ADVENTURES PH</h1>
    <p>Race Photos & Event Photography</p>
</header>

<section class="hero">
    <h2>Find Your Photos</h2>

    <p>
        Search your race photos using your Bib Number.
    </p>

    <div class="search-box">
        <input type="text" id="bibNumber" placeholder="Enter your Bib Number">
        <button onclick="searchPhotos()">SEARCH</button>
    </div>
</section>

<section class="events">

    <h2>Latest Events</h2>

    <div class="event-grid">

        <div class="event-card">
            <div class="event-image">
                EVENT PHOTO
            </div>

            <div class="event-info">
                <h3>DC2DC 60KM 2026</h3>
                <p>Road Ultramarathon</p>
                <button onclick="openEvent()">
                    VIEW PHOTOS
                </button>
            </div>
        </div>

        <div class="event-card">
            <div class="event-image">
                EVENT PHOTO
            </div>

            <div class="event-info">
                <h3>Trail Run 2026</h3>
                <p>Trail Running Event</p>
                <button onclick="openEvent()">
                    VIEW PHOTOS
                </button>
            </div>
        </div>

    </div>

</section>

<footer>
    © 2026 Sports Adventures PH
</footer>

<script>

function searchPhotos() {

    const bib = document.getElementById("bibNumber").value;

    if (bib.trim() === "") {
        alert("Please enter your Bib Number.");
        return;
    }

    alert("Searching photos for Bib Number: " + bib);
}

function openEvent() {
    alert("Event gallery coming soon!");
}

</script>

</body>
</html>
