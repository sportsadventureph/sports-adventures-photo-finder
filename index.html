<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sports Adventures PH | Find My Photos</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        header h1 {
            font-size: 28px;
        }

        header p {
            margin-top: 6px;
            color: #bbb;
        }

        .hero {
            background: white;
            text-align: center;
            padding: 60px 20px;
        }

        .hero h2 {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .hero p {
            color: #666;
            margin-bottom: 25px;
        }

        .search-box {
            max-width: 500px;
            margin: auto;
            display: flex;
            gap: 10px;
        }

        .search-box input {
            flex: 1;
            padding: 15px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .search-box button {
            padding: 15px 25px;
            background: #111;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .search-box button:hover {
            background: #333;
        }

        .results {
            max-width: 1100px;
            margin: auto;
            padding: 40px 20px;
            display: none;
        }

        .results h2 {
            margin-bottom: 25px;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .photo-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        .photo-card img {
            width: 100%;
            display: block;
        }

        .photo-info {
            padding: 15px;
        }

        .photo-info button {
            width: 100%;
            margin-top: 10px;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #111;
            color: white;
            cursor: pointer;
        }

        .events {
            max-width: 1100px;
            margin: auto;
            padding: 50px 20px;
        }

        .events h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .event-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
        }

        .event-card h3 {
            margin-bottom: 8px;
        }

        .event-card p {
            color: #666;
        }

        footer {
            margin-top: 30px;
            background: #111;
            color: #aaa;
            text-align: center;
            padding: 25px;
        }

        @media (max-width: 600px) {

            .hero h2 {
                font-size: 32px;
            }

            .search-box {
                flex-direction: column;
            }

        }
    </style>
</head>

<body>

<header>
    <h1>SPORTS ADVENTURES PH</h1>
    <p>Race Photos & Event Photography</p>
</header>

<section class="hero">

    <h2>Find Your Photos</h2>

    <p>
        Enter your Bib Number to find your race photos.
    </p>

    <div class="search-box">

        <input
            type="text"
            id="bibNumber"
            placeholder="Enter Bib Number"
        >

        <button onclick="searchPhotos()">
            SEARCH
        </button>

    </div>

</section>


<section class="results" id="results">

    <h2 id="resultTitle"></h2>

    <div class="photo-grid" id="photoGrid"></div>

</section>


<section class="events">

    <h2>Latest Events</h2>

    <div class="event-card">

        <h3>Sample Running Event 2026</h3>

        <p>
            Search your photos using your Bib Number.
        </p>

    </div>

</section>


<footer>

    © 2026 Sports Adventures PH

</footer>


<script>

const photos = {

    "1001": [
        "069A9169.jpg",
        "545817393_122178533090553192_2330837409284352842_n.jpg"
    ],

    "1002": [
        "605557730_122195883866553192_1161491079711210089_n.jpg"
    ]

};


function searchPhotos() {

    const bib =
        document.getElementById("bibNumber").value.trim();

    const results =
        document.getElementById("results");

    const grid =
        document.getElementById("photoGrid");

    const title =
        document.getElementById("resultTitle");

    grid.innerHTML = "";

    if (!photos[bib]) {

        results.style.display = "block";

        title.textContent =
            "No photos found for Bib " + bib;

        return;
    }


    results.style.display = "block";

    title.textContent =
        "Photos for Bib " + bib;


    photos[bib].forEach(function(photo) {

        const card =
            document.createElement("div");

        card.className =
            "photo-card";


        card.innerHTML = `

            <img
                src="${photo}"
                alt="Race Photo"
            >

            <div class="photo-info">

                <strong>Bib ${bib}</strong>

                <button
                    onclick="alert('HD download / payment system will be added next.')"
                >
                    BUY / DOWNLOAD HD
                </button>

            </div>

        `;


        grid.appendChild(card);

    });

}

</script>

</body>
</html>
