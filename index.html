<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sports Adventures PH</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        .hero {
            background: linear-gradient(135deg, #111, #333);
            color: white;
            text-align: center;
            padding: 70px 20px;
        }

        .hero h1 {
            font-size: 42px;
            margin: 0 0 15px;
        }

        .hero p {
            font-size: 18px;
            margin: 0;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 40px 20px;
        }

        .events {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px;
        }

        .event-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.10);
        }

        .event-card img {
            width: 100%;
            height: 190px;
            object-fit: cover;
        }

        .event-content {
            padding: 20px;
            text-align: center;
        }

        .event-content h3 {
            margin: 0 0 15px;
            font-size: 20px;
        }

        .event-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .event-btn:hover {
            background: #333;
        }

        #searchBox {
            display: none;
            margin-top: 50px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.10);
            text-align: center;
        }

        #searchBox.show {
            display: block;
        }

        #eventTitle {
            margin-top: 0;
        }

        #bibInput {
            width: 100%;
            max-width: 400px;
            padding: 15px;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin: 15px 0;
        }

        .search-btn {
            padding: 14px 30px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        #message {
            margin: 15px 0;
        }

        #results {
            margin-top: 25px;
        }

        footer {
            margin-top: 50px;
            padding: 25px;
            text-align: center;
            background: #111;
            color: white;
        }
    </style>
</head>

<body>

<header>
    SPORTS ADVENTURES PH
</header>

<section class="hero">
    <h1>FIND YOUR RACE PHOTOS</h1>
    <p>Search your race photos using your Bib Number</p>
</section>

<div class="container">

    <div class="events">

        <div class="event-card">
            <img src="069A9169.jpg" alt="Ironman 70.3 Davao">

            <div class="event-content">
                <h3>Ironman 70.3 Davao</h3>

                <button
                    class="event-btn"
                    onclick="selectEvent('Ironman 70.3 Davao')">
                    FIND MY PHOTOS
                </button>
            </div>
        </div>


        <div class="event-card">
            <img src="545817393_122178533090553192_2330837409284352842_n.jpg"
                alt="TriDavOr 2026">

            <div class="event-content">
                <h3>TriDavOr 2026</h3>

                <button
                    class="event-btn"
                    onclick="selectEvent('TriDavOr 2026')">
                    FIND MY PHOTOS
                </button>
            </div>
        </div>


        <div class="event-card">
            <img src="605557730_122195883866553192_1161491079711210089_n.jpg"
                alt="Coral Dash 2026">

            <div class="event-content">
                <h3>Coral Dash 2026</h3>

                <button
                    class="event-btn"
                    onclick="selectEvent('Coral Dash 2026')">
                    FIND MY PHOTOS
                </button>
            </div>
        </div>


        <div class="event-card">
            <img src="069A9169.jpg"
                alt="Damosa Land 5150 Samal">

            <div class="event-content">
                <h3>Damosa Land 5150 Samal</h3>

                <button
                    class="event-btn"
                    onclick="selectEvent('Damosa Land 5150 Samal')">
                    FIND MY PHOTOS
                </button>
            </div>
        </div>

    </div>


    <div id="searchBox">

        <h2 id="eventTitle">📸 Select an Event</h2>

        <p id="message">
            Select an event above to search your photos.
        </p>

        <input
            type="text"
            id="bibInput"
            placeholder="Enter your Bib Number">

        <br>

        <button
            class="search-btn"
            onclick="searchBib()">
            SEARCH
        </button>

        <div id="results"></div>

    </div>

</div>


<footer>
    © 2026 Sports Adventures PH
</footer>


<script>

let selectedEvent = "";
let selectedEventId = null;


function selectEvent(eventName) {

    selectedEvent = eventName;

    document.getElementById("eventTitle").innerText =
        "📸 " + eventName;

    document.getElementById("message").innerText =
        "Ready to search photos from " + eventName;

    document.getElementById("bibInput").value = "";

    document.getElementById("results").innerHTML = "";

    document.getElementById("searchBox").classList.add("show");

    document.getElementById("searchBox").scrollIntoView({
        behavior: "smooth"
    });
}


async function searchBib() {

    const bib =
        document.getElementById("bibInput").value.trim();

    if (!bib) {

        document.getElementById("message").innerText =
            "Please enter your Bib Number.";

        return;
    }

    document.getElementById("message").innerText =
        "Searching Bib " + bib + "...";

    document.getElementById("results").innerHTML =
        "Loading...";

    try {

        const response = await fetch(
            "https://dcnaeyxzcdqgbxczmmeu.supabase.co/rest/v1/photos?bib_number=eq." +
            encodeURIComponent(bib) +
            "&select=*",
            {
                headers: {
                    "apikey": "sb_publishable_TPa93LPBs7vU0hIXhoW5nw_XuaSnIDo",
                    "Authorization": "Bearer sb_publishable_TPa93LPBs7vU0hIXhoW5nw_XuaSnIDo"
                }
            }
        );

        if (!response.ok) {

            const errorText = await response.text();

            throw new Error(
                "Search failed: " +
                response.status +
                " - " +
                errorText
            );
        }

        const photos = await response.json();

        console.log("Photos found:", photos);

        if (photos.length === 0) {

            document.getElementById("message").innerText =
                "No photos found for Bib " + bib;

            document.getElementById("results").innerHTML =
                "<p>No photos found.</p>";

            return;
        }

        document.getElementById("message").innerText =
            photos.length + " photo(s) found for Bib " + bib;

        document.getElementById("results").innerHTML = "";

        photos.forEach(function(photo) {

            const photoBox = document.createElement("div");

            photoBox.style.background = "white";
            photoBox.style.padding = "15px";
            photoBox.style.marginTop = "15px";
            photoBox.style.borderRadius = "10px";

            photoBox.innerHTML =
                "<p><strong>Bib Number:</strong> " +
                photo.bib_number +
                "</p>" +

                "<p><strong>Filename:</strong> " +
                photo.filename +
                "</p>";

            document.getElementById("results")
                .appendChild(photoBox);

        });

    } catch (error) {

        console.error(error);

        document.getElementById("message").innerText =
            "❌ Search failed.";

        document.getElementById("results").innerHTML =
            "<p>" + error.message + "</p>";
    }
}

</script>

</body>
</html>
